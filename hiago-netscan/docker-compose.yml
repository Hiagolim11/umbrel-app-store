version: "3.7"

services:
  web:
    image: ghcr.io/hiagolim11/netscan:1.4.1
    # rede do host para enxergar a LAN (como o Home Assistant no Umbrel)
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: on-failure
    environment:
      NETSCAN_PASSWORD: $APP_PASSWORD
      NETSCAN_PORT: "7765"
    volumes:
      - ${APP_DATA_DIR}/data:/data
