tagline: Análise automática de segurança da sua rede local
icon: https://raw.githubusercontent.com/Hiagolim11/umbrel-app-store/master/hiago-netscan/icon.png
description: >-
  Descobre todos os aparelhos da rede, identifica o que cada um é, encontra
  vulnerabilidades e configurações perigosas, prioriza o que corrigir primeiro
  (CISA KEV, EPSS, Exploit-DB) e avisa quando algo muda — por ntfy, Discord,
  Slack ou Telegram.


  Use somente na sua própria rede ou com autorização explícita.
releaseNotes: >-
  Falhas do Telegram agora mostram o motivo real e o que fazer (token inválido,
  chat não encontrado, falta enviar /start ao bot) em vez de só "HTTPError".
